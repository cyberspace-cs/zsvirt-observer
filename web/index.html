<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSvirt Observer - AI 根因诊断平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* 背景光晕 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(52, 211, 153, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    /* 顶部 Hero */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #34d399;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .hero p {
      font-size: 18px;
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto;
    }
    /* 大按钮 */
    .demo-btn-wrap {
      text-align: center;
      margin: 40px 0;
    }
    .demo-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 20px 48px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(239, 68, 68, 0.5);
    }
    .demo-btn:active {
      transform: translateY(0);
    }
    .demo-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .demo-btn .icon { font-size: 24px; }
    /* 时间线 */
    .timeline {
      max-width: 700px;
      margin: 40px auto;
      display: none;
    }
    .timeline.active { display: block; }
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 0;
      opacity: 0.3;
      transition: all 0.5s;
    }
    .timeline-item.done { opacity: 1; }
    .timeline-item.done .dot { background: #34d399; box-shadow: 0 0 12px #34d399; }
    .timeline-item.current {
      opacity: 1;
    }
    .timeline-item.current .dot {
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 12px #fbbf24; }
      50% { box-shadow: 0 0 24px #fbbf24; }
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
    }
    .timeline-content { flex: 1; }
    .timeline-title { font-size: 14px; font-weight: 600; }
    .timeline-desc { font-size: 12px; color: #64748b; margin-top: 2px; }
    /* 根因报告卡片 */
    .report-card {
      max-width: 700px;
      margin: 30px auto;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(52, 211, 153, 0.2);
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }
    .report-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    .report-card .confidence {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(52, 211, 153, 0.15);
      border-radius: 20px;
      font-size: 13px;
      color: #34d399;
      margin-bottom: 20px;
    }
    .report-card h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #fff;
    }
    .report-card .root-cause {
      color: #f87171;
      font-weight: 600;
    }
    .report-card .reasoning {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.8;
      margin: 16px 0;
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      border-left: 3px solid #3b82f6;
    }
    .report-card .suggestions {
      margin-top: 20px;
    }
    .report-card .suggestions h3 {
      font-size: 14px;
      color: #34d399;
      margin-bottom: 10px;
    }
    .report-card .suggestions li {
      font-size: 13px;
      color: #cbd5e1;
      margin: 6px 0;
      margin-left: 20px;
    }
    .report-card .impact {
      margin-top: 16px;
      font-size: 13px;
      color: #fbbf24;
    }
    /* 统计栏 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: #34d399;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero -->
    <div class="hero">
      <div class="badge">🚀 2026 上海开源大赛 · 智算云赛道</div>
      <h1>AI 根因诊断平台</h1>
      <p>从告警到根因，传统 SRE 需要 45 分钟<br/>我们用 AI 把它压缩到 <b style="color:#34d399">30 秒</b></p>
    </div>

    <!-- 统计 -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-num" id="stat-nodes">16</div>
        <div class="stat-label">监控节点</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-layers">5</div>
        <div class="stat-label">全栈层级</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">&lt;30s</div>
        <div class="stat-label">根因定位</div>
      </div>
    </div>

    <!-- 大按钮 -->
    <div class="demo-btn-wrap">
      <button class="demo-btn" id="fault-btn" onclick="startDemo()">
        <span class="icon">🔥</span>
        一键制造故障
      </button>
    </div>

    <!-- 时间线 -->
    <div class="timeline" id="timeline">
      <div class="timeline-item" id="step-1">
        <div class="dot"></div>
        <div class="timeline-content">
          <div class="timeline-title">⚡ 故障发生</div>
          <div class="timeline-desc">GPU 显存耗尽，推理服务开始超时</div>
        </div>
      </div>
      <div class="timeline-item" id="step-2">
        <div class="dot"></div>
        <div class="timeline-content">
          <div class="timeline-title">🚨 告警触发</div>
          <div class="timeline-desc">Prometheus AlertManager 捕获异常</div>
        </div>
      </div>
      <div class="timeline-item" id="step-3">
        <div class="dot"></div>
        <div class="timeline-content">
          <div class="timeline-title">🤖 AI 深度分析中...</div>
          <div class="timeline-desc">LLM 正在推理根因，分析影响范围</div>
        </div>
      </div>
      <div class="timeline-item" id="step-4">
        <div class="dot"></div>
        <div class="timeline-content">
          <div class="timeline-title">✅ 根因定位完成</div>
          <div class="timeline-desc">生成诊断报告和修复建议</div>
        </div>
      </div>
    </div>

    <!-- 根因报告 -->
    <div class="report-card" id="report-card">
      <div class="confidence" id="confidence-badge">
        🎯 AI 置信度: <span id="confidence-value">--</span>%
      </div>
      <h2>根因: <span class="root-cause" id="root-cause-text">--</span></h2>
      <div class="reasoning" id="reasoning-text">--</div>
      <div class="suggestions">
        <h3>💡 修复建议</h3>
        <ul id="suggestions-list">
          <li>--</li>
        </ul>
      </div>
      <div class="impact" id="impact-text">--</div>
    </div>

  </div>

  <script>
    const API = '';

    async function startDemo() {
      const btn = document.getElementById('fault-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="icon">⏳</span> 诊断中...';

      // 重置状态
      document.getElementById('timeline').classList.add('active');
      document.getElementById('report-card').classList.remove('show');
      ['step-1','step-2','step-3','step-4'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('done', 'current');
      });

      // Step 1: 故障发生
      setStep(1);
      await sleep(800);

      // Step 2: 告警触发
      setStep(2);
      await sleep(600);

      // Step 3: AI 分析中
      setStep(3);

      // 调用后端 API
      try {
        const res = await fetch(`${API}/webhook/alerts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            alerts: [{
              labels: {
                alertname: 'GPUOOM',
                severity: 'critical',
                container_id: 'container-01',
                instance: 'vm-01'
              },
              annotations: {
                summary: 'GPU 显存不足，推理服务超时'
              },
              status: 'firing'
            }]
          })
        });
        const data = await res.json();
        const result = data.results[0];

        // Step 4: 完成
        await sleep(400);
        setStep(4);

        // 展示报告
        setTimeout(() => {
          showReport(result);
        }, 300);

      } catch (e) {
        console.error(e);
        document.getElementById('step-3 .timeline-desc').textContent = '连接失败';
      }

      // 恢复按钮
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<span class="icon">🔥</span> 再来一次';
      }, 3000);
    }

    function setStep(n) {
      for (let i = 1; i < n; i++) {
        document.getElementById(`step-${i}`).classList.add('done');
        document.getElementById(`step-${i}`).classList.remove('current');
      }
      document.getElementById(`step-${n}`).classList.add('current');
    }

    function showReport(result) {
      document.getElementById('root-cause-text').textContent = result.root_cause;
      document.getElementById('confidence-value').textContent = extractConfidence(result.summary);
      document.getElementById('reasoning-text').textContent = result.summary;
      document.getElementById('impact-text').textContent = `📦 影响资源: ${result.impacted} 个下游服务`;

      // 修复建议
      const list = document.getElementById('suggestions-list');
      list.innerHTML = `<li>${result.suggestion}</li>`;

      document.getElementById('report-card').classList.add('show');
    }

    function extractConfidence(summary) {
      const match = summary.match(/(\d+)%/);
      return match ? match[1] : '85';
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
