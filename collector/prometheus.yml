global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则
rule_files:
  - /etc/prometheus/rules/*.yml

# AlertManager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 宿主机指标
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # 容器指标
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  # GPU 指标（需要 GPU 环境）
  - job_name: "gpu"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    metrics_path: /metrics

  # Observer 自身指标
  - job_name: "observer"
    static_configs:
      - targets: ["observer:8000"]
    metrics_path: /metrics
